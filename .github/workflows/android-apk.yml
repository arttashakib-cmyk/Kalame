name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -q KalamechiApp.zip -d extracted
          cp -a extracted/KalamechiApp/app .
          cp -a extracted/KalamechiApp/build.gradle.kts .
          cp -a extracted/KalamechiApp/settings.gradle.kts .
          cp -a extracted/KalamechiApp/gradle.properties .
          ls app/src/main/java/ir/kalamechi/learning/

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true

      - name: Configure Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          mkdir -p "$ANDROID_HOME/licenses"
          echo 24333f8a63b6825ea9c5514f83c2829b004d1fee > "$ANDROID_HOME/licenses/android-sdk-license"
          CMDLINE=$(find "$ANDROID_HOME" -name sdkmanager | head -1)
          yes | "$CMDLINE" --licenses > /dev/null 2>&1 || true
          "$CMDLINE" "platforms;android-35" "build-tools;35.0.0" "platform-tools" || true

      - name: Create Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.13
          chmod +x gradlew

      - name: Build Debug APK
        continue-on-error: true
        run: ./gradlew assembleDebug --stacktrace --no-daemon --no-build-cache --rerun-tasks 2>&1 | tee build.log

      - name: Show errors
        if: always()
        run: |
          grep -E "^e: |FAILURE:" build.log | head -40 || true
          tail -20 build.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-output
          path: |
            app/build/outputs/apk/debug/*.apk
            build.log
          if-no-files-found: warn
