name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          echo "=== Repo root ==="
          ls -la
          ZIP=$(find . -maxdepth 2 -name "*.zip" | head -1)
          if [ -z "$ZIP" ]; then
            echo "No ZIP found"
            exit 1
          fi
          echo "Found: $ZIP"
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted
          # Find where settings.gradle.kts lives
          SETTINGS=$(find extracted -name "settings.gradle.kts" | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle.kts not found inside ZIP"
            find extracted -type f | head -50
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "Project dir: $PROJECT_DIR"
          # Copy project files into workspace (skip .github to avoid conflict)
          shopt -s dotglob
          for item in "$PROJECT_DIR"/*; do
            name=$(basename "$item")
            if [ "$name" = ".github" ]; then
              echo "Skipping .github from ZIP"
              continue
            fi
            cp -a "$item" .
          done
          shopt -u dotglob
          echo "=== After extract ==="
          ls -la
          test -f settings.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Configure Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "84831b94096449617ae0f5390dcea4d0e79c4cbc\n" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          CMDLINE=$(find "$ANDROID_HOME" -name sdkmanager 2>/dev/null | head -1)
          if [ -n "$CMDLINE" ]; then
            yes | "$CMDLINE" --licenses >/dev/null 2>&1 || true
            "$CMDLINE" "platforms;android-36" "build-tools;36.0.0" "platform-tools" 2>/dev/null || \
            "$CMDLINE" "platforms;android-35" "build-tools;35.0.0" "platform-tools" 2>/dev/null || true
          fi

      - name: Create Gradle Wrapper
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 9.6.0
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kalamechi-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
