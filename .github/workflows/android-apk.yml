name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        run: |
          echo "=== Repo root contents ==="
          ls -la
          # Find any zip in the repo
          ZIP=$(find . -maxdepth 2 -name "*.zip" | head -1)
          if [ -n "$ZIP" ]; then
            echo "Found ZIP: $ZIP"
            mkdir -p project
            unzip -q "$ZIP" -d project
            # If zip contains a single top folder, go into it
            if [ $(ls project | wc -l) -eq 1 ]; then
              SUB=$(ls project)
              echo "Moving contents of $SUB to workspace"
              shopt -s dotglob
              mv project/$SUB/* .
              shopt -u dotglob
            else
              shopt -s dotglob
              mv project/* .
              shopt -u dotglob
            fi
            rm -rf project
          fi
          echo "=== After extract ==="
          ls -la
          test -f settings.gradle.kts || test -f settings.gradle || (echo "ERROR: settings.gradle.kts still missing" && exit 1)

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Configure Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "84831b94096449617ae0f5390dcea4d0e79c4cbc\n" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          CMDLINE=$(find "$ANDROID_HOME" -name sdkmanager 2>/dev/null | head -1)
          if [ -n "$CMDLINE" ]; then
            yes | "$CMDLINE" --licenses >/dev/null 2>&1 || true
            "$CMDLINE" "platforms;android-36" "build-tools;36.0.0" "platform-tools" 2>/dev/null || \
            "$CMDLINE" "platforms;android-35" "build-tools;35.0.0" "platform-tools" 2>/dev/null || true
          fi

      - name: Create Gradle Wrapper
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 9.6.0
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kalamechi-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            **/app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: warn
