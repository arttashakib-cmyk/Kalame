name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          ZIP=$(find . -maxdepth 2 -name "*.zip" | head -1)
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted
          PROJECT_DIR=\( (dirname " \)(find extracted -name settings.gradle.kts | head -1)")
          shopt -s dotglob
          for item in "$PROJECT_DIR"/*; do
            [ "$(basename "$item")" = ".github" ] && continue
            cp -a "$item" .
          done
          shopt -u dotglob
          ls -la

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Configure Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          mkdir -p "$ANDROID_HOME/licenses"
          printf '24333f8a63b6825ea9c5514f83c2829b004d1fee\n' > "$ANDROID_HOME/licenses/android-sdk-license"
          CMDLINE=$(find "$ANDROID_HOME" -name sdkmanager 2>/dev/null | head -1)
          [ -n "$CMDLINE" ] && yes | "$CMDLINE" --licenses >/dev/null 2>&1 || true
          [ -n "$CMDLINE" ] && "$CMDLINE" "platforms;android-35" "build-tools;35.0.0" "platform-tools" || true

      - name: Create Gradle Wrapper
        run: gradle wrapper --gradle-version 8.13 && chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: kalamechi-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
